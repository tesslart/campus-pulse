<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1228" />
    <meta name="description" content="CAMPUS PULSE — студенческая афиша: находи события университета, создавай свои и записывайся." />
    <title>CAMPUS PULSE</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#view">Перейти к содержимому</a>
    <div id="app" class="app">
      <header class="header">
        <div class="container header__inner">
          <a class="logo" href="#/" aria-label="CAMPUS PULSE — на главную">
            <svg class="logo__mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
            <span>CAMPUS <span class="logo__accent">PULSE</span></span>
          </a>
          <nav class="nav" aria-label="Основная навигация">
            <a class="nav__link" href="#/" data-nav="/">События</a>
            <a class="nav__link" href="#/my" data-nav="/my">Мои записи</a>
          </nav>
          <div class="header__auth" id="header-auth"></div>
        </div>
      </header>

      <div class="offline-banner" id="offline" role="alert" hidden>
        Нет подключения к интернету. Данные хранятся в облаке — проверьте сеть.
      </div>

      <main class="container main" id="view" tabindex="-1"></main>

      <footer class="footer container">
        <span>CAMPUS PULSE · GitHub + Supabase</span>
      </footer>

      <nav class="tabbar" id="tabbar" aria-label="Мобильная навигация"></nav>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
